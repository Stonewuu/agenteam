# 修改站点、证书和内部端口后使用；此文件不会自动发布或修改系统配置。
server {
    listen 80;
    server_name agenteam.example.com;
    return 308 https://agenteam.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name agenteam.example.com;
    ssl_certificate /etc/nginx/tls/agenteam.crt;
    ssl_certificate_key /etc/nginx/tls/agenteam.key;
    client_max_body_size 20m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 正式接口直接到后端，避免登录限速把所有用户当作 Next.js 服务器。
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
    }
}
