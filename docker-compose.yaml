name: ${COMPOSE_PROJECT_NAME:-agenteam}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-sandbox-limits: &sandbox-limits
  AGENTEAM_SANDBOX_IMAGE: ${SANDBOX_IMAGE:-docker.io/stonewuu/agenteam-sandbox-office:latest}
  AGENTEAM_SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-2048}
  AGENTEAM_SANDBOX_WORKSPACE_MB: ${SANDBOX_WORKSPACE_MB:-512}
  AGENTEAM_SANDBOX_TEMPORARY_MB: ${SANDBOX_TEMPORARY_MB:-256}
  AGENTEAM_SANDBOX_MAXIMUM_CONCURRENT: ${SANDBOX_MAXIMUM_CONCURRENT:-2}
  AGENTEAM_SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-1800}
  AGENTEAM_COMMAND_RESULTS_RETENTION_DAYS: ${COMMAND_RESULTS_RETENTION_DAYS:-7}
  AGENTEAM_COMMAND_RESULTS_MAXIMUM_MB: ${COMMAND_RESULTS_MAXIMUM_MB:-256}
  AGENTEAM_COMMAND_RESULTS_MAXIMUM_ENTRIES: ${COMMAND_RESULTS_MAXIMUM_ENTRIES:-1000}
  AGENTEAM_SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-1800}
  AGENTEAM_SANDBOX_IDLE_SCAN_SECONDS: ${SANDBOX_IDLE_SCAN_SECONDS:-30}
  AGENTEAM_SANDBOX_USAGE_STALE_SECONDS: ${SANDBOX_USAGE_STALE_SECONDS:-60}
  AGENTEAM_SANDBOX_STOP_SECONDS: ${SANDBOX_STOP_SECONDS:-10}
  AGENTEAM_SANDBOX_MAXIMUM_RUNNING_CONTAINERS: ${SANDBOX_MAXIMUM_RUNNING_CONTAINERS:-4}
  AGENTEAM_SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
  AGENTEAM_SANDBOX_PROCESS_LIMIT: ${SANDBOX_PROCESS_LIMIT:-128}

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.io/library/mysql:8}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agenteam
      MYSQL_USER: agenteam
      MYSQL_PASSWORD_FILE: /run/agenteam-secrets/database/AGENTEAM_DB_PASSWORD
      MYSQL_ROOT_PASSWORD_FILE: /run/agenteam-secrets/mysql-root/MYSQL_ROOT_PASSWORD
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - database-credential:/run/agenteam-secrets/database:ro
      - mysql-root-credential:/run/agenteam-secrets/mysql-root:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
        restart: true
    mem_limit: ${MYSQL_MEMORY:-0}
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat \"$$MYSQL_PASSWORD_FILE\")\" mysqladmin --protocol=tcp -h127.0.0.1 -u\"$$MYSQL_USER\" status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [application]

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: unless-stopped
    entrypoint:
      - sh
      - -ec
      - |
        password=$$(cat /run/agenteam-secrets/cache/AGENTEAM_REDIS_PASSWORD)
        test -n "$$password"
        exec docker-entrypoint.sh redis-server --requirepass "$$password" "$$@"
      - --
    command: ["--appendonly", "yes"]
    volumes:
      - redis-data:/data
      - cache-credential:/run/agenteam-secrets/cache:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
        restart: true
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/agenteam-secrets/cache/AGENTEAM_REDIS_PASSWORD)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]

  storage-init:
    image: ${APP_IMAGE:-docker.io/stonewuu/agenteam-backend:latest}
    user: "0:0"
    entrypoint: ["sh", "/opt/agenteam/init-storage.sh"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SETUP_CREDENTIAL: ${SETUP_CREDENTIAL:-}
    volumes:
      - ./deploy/container/init-storage.sh:/opt/agenteam/init-storage.sh:ro
      - mysql-data:/existing-mysql:ro
      - database-credential:/run/agenteam-secrets/database
      - mysql-root-credential:/run/agenteam-secrets/mysql-root
      - cache-credential:/run/agenteam-secrets/cache
      - executor-credential:/run/agenteam-secrets/executor
      - setup-credential:/run/agenteam-secrets/setup
      - app-data:/app-data
      - user-workspaces:/user-workspaces
      - executor-data:/executor-data
    network_mode: none
    restart: "no"

  sandbox-image:
    image: ${SANDBOX_IMAGE:-docker.io/stonewuu/agenteam-sandbox-office:latest}
    command: ["true"]
    network_mode: none
    read_only: true
    restart: "no"

  backend:
    image: ${APP_IMAGE:-docker.io/stonewuu/agenteam-backend:latest}
    restart: unless-stopped
    environment:
      <<: *sandbox-limits
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-container}
      SPRING_CONFIG_IMPORT: "configtree:/run/agenteam-secrets/*/"
      SERVER_SERVLET_SESSION_COOKIE_SECURE:
      AGENTEAM_BIND_ADDRESS: 0.0.0.0
      AGENTEAM_STORAGE_ROOT: /var/lib/agenteam
      AGENTEAM_USER_WORKSPACES_ROOT: /var/lib/agenteam-projects
      AGENTEAM_DB_URL: "jdbc:mariadb://mysql:3306/agenteam?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true"
      AGENTEAM_DB_USERNAME: agenteam
      AGENTEAM_REDIS_HOST: redis
      AGENTEAM_REDIS_PORT: 6379
      AGENTEAM_PUBLIC_ORIGIN: ${PUBLIC_URL:-http://localhost:${HTTP_PORT:-8088}}
      AGENTEAM_NOTIFICATION_ACTIONS_ENABLED: ${NOTIFICATION_ACTIONS_ENABLED:-true}
      AGENTEAM_SCHEDULE_ACTION_WORKER_ENABLED: ${SCHEDULE_ACTION_WORKER_ENABLED:-true}
      AGENTEAM_CHANNEL_DELIVERY_WORKER_ENABLED: ${CHANNEL_DELIVERY_WORKER_ENABLED:-true}
      AGENTEAM_CHAT_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:${HTTP_PORT:-8088}}
      AGENTEAM_TRUSTED_PROXIES: ${NETWORK_PREFIX:-172.29.44}.10/32
      AGENTEAM_SANDBOX_BACKEND: remote
      AGENTEAM_SANDBOX_REMOTE_URL: http://127.0.0.1:8092/
      AGENTEAM_MAIL_HOST: ${MAIL_HOST:-}
      AGENTEAM_MAIL_PORT: ${MAIL_PORT:-587}
      AGENTEAM_MAIL_USERNAME: ${MAIL_USERNAME:-}
      AGENTEAM_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      AGENTEAM_MAIL_FROM: ${MAIL_FROM:-}
      AGENTEAM_ALLOWED_PRIVATE_ORIGINS: ${ALLOWED_PRIVATE_ORIGINS:-}
      AGENTEAM_FILE_SCAN_ENABLED: ${AGENTEAM_FILE_SCAN_ENABLED:-false}
      AGENTEAM_FILE_SCAN_HOST: ${AGENTEAM_FILE_SCAN_HOST:-}
      AGENTEAM_FILE_SCAN_PORT: ${AGENTEAM_FILE_SCAN_PORT:-3310}
    volumes:
      - database-credential:/run/agenteam-secrets/database:ro
      - cache-credential:/run/agenteam-secrets/cache:ro
      - executor-credential:/run/agenteam-secrets/executor:ro
      - setup-credential:/run/agenteam-secrets/setup:ro
      - app-data:/var/lib/agenteam
      - user-workspaces:/var/lib/agenteam-projects
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:9091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: ${BACKEND_MEMORY:-0}
    logging: *logging
    networks: [application]
    extra_hosts:
      - host.docker.internal:host-gateway

  sandbox-executor:
    container_name: ${COMPOSE_PROJECT_NAME:-agenteam}-sandbox-executor
    image: ${EXECUTOR_IMAGE:-docker.io/stonewuu/agenteam-sandbox-server:latest}
    entrypoint:
      - sh
      - -ec
      - |
        AGENTEAM_SANDBOX_REMOTE_TOKEN=$$(cat /run/agenteam-secrets/executor/AGENTEAM_SANDBOX_REMOTE_TOKEN)
        export AGENTEAM_SANDBOX_REMOTE_TOKEN
        exec sh /app/sandbox-entrypoint.sh
    restart: unless-stopped
    # 使用同一主机网络空间中的回环地址，不放宽独立执行接口的地址校验。
    network_mode: service:backend
    environment:
      <<: *sandbox-limits
      AGENTEAM_EXECUTOR_CONTAINER: ${COMPOSE_PROJECT_NAME:-agenteam}-sandbox-executor
      AGENTEAM_SANDBOX_BIND_ADDRESS: 127.0.0.1
      AGENTEAM_SANDBOX_PORT: 8092
      AGENTEAM_SANDBOX_SERVER_ROOT: /var/lib/agenteam-executor
      AGENTEAM_SANDBOX_LOCAL_MOUNT_ROOT: /var/lib/agenteam-executor
      AGENTEAM_USER_WORKSPACES_ROOT: /var/lib/agenteam-projects
    volumes:
      - executor-credential:/run/agenteam-secrets/executor:ro
      - executor-data:/var/lib/agenteam-executor
      - user-workspaces:/var/lib/agenteam-projects
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_started
        restart: true
      sandbox-image:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl --silent --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8092/executions/health)\" = 401"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    cap_drop: [ALL]
    # 启动时切换到后端相同账号；Java 进程和模型命令容器均以非管理员身份运行。
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: ${EXECUTOR_MEMORY:-0}
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-docker.io/stonewuu/agenteam-frontend:latest}
    restart: unless-stopped
    environment:
      AGENT_BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [application]
    mem_limit: ${FRONTEND_MEMORY:-0}
    logging: *logging

  nginx:
    image: ${GATEWAY_IMAGE:-docker.io/library/nginx:1-alpine}
    # 使用官方镜像，项目配置通过只读文件挂载；直接启动项目脚本，避免基础镜像检查无用的默认站点。
    entrypoint: ["sh", "/etc/agenteam/start-nginx.sh"]
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${HTTP_PORT:-8088}}
      TRUSTED_EDGE_PROXIES: ${TRUSTED_EDGE_PROXIES:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    logging: *logging
    volumes:
      - type: bind
        source: ./deploy/nginx/15-agenteam-config.sh
        target: /etc/agenteam/start-nginx.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/nginx/default.conf.template
        target: /etc/nginx/agenteam.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/nginx/api.conf
        target: /etc/nginx/agenteam-api.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      sandbox-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      application:
        ipv4_address: ${NETWORK_PREFIX:-172.29.44}.10

networks:
  application:
    ipam:
      config:
        - subnet: ${NETWORK_PREFIX:-172.29.44}.0/24

volumes:
  database-credential:
  mysql-root-credential:
  cache-credential:
  executor-credential:
  setup-credential:
  mysql-data:
  redis-data:
  app-data:
  user-workspaces:
  executor-data:
