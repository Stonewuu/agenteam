server:
  # 容器内监听全部接口；对外端口仅由 Nginx 的 Compose 映射提供。
  address: "0.0.0.0"
  port: "8080"
  forward-headers-strategy: "native"
  tomcat:
    remoteip:
      remote-ip-header: "X-Forwarded-For"
      protocol-header: "X-Forwarded-Proto"
      internal-proxies: "${AGENTEAM_TRUSTED_PROXIES}"
      trusted-proxies: ""
agenteam:
  web:
    public-base-url: "${AGENTEAM_PUBLIC_ORIGIN}"
  mail:
    from: "${AGENTEAM_MAIL_FROM:}"
spring:
  mail:
    host: "${AGENTEAM_MAIL_HOST:}"
    port: "${AGENTEAM_MAIL_PORT:587}"
    username: "${AGENTEAM_MAIL_USERNAME:}"
    password: "${AGENTEAM_MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "true"
management:
  server:
    # 检查本实例的数据库和 Redis，邮件服务的可用性不决定容器是否存活。
    port: "9091"
    address: "127.0.0.1"
  health:
    mail:
      enabled: "false"
springdoc:
  api-docs:
    enabled: "false"
  swagger-ui:
    enabled: "false"
